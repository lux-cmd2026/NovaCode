name: Build installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Package win-x64 + win-arm64 (NSIS)
        run: npx electron-builder --win --x64 --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: NovaCode-windows
          path: release/*.exe

  macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Package macOS dmg (x64 + arm64)
        run: npx electron-builder --mac --x64 --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: NovaCode-macos
          path: release/*.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package Linux (AppImage + deb)
        run: npx electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: NovaCode-linux
          path: |
            release/*.AppImage
            release/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
